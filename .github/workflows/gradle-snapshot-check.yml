name: Check automated Gradle snapshot bump
on:
  workflow_call:
    inputs:
      version-files:
        description: Exact newline-separated paths to the Gradle Semver version.properties files
        required: true
        type: string
    outputs:
      verified:
        value: ${{ jobs.Classify.outputs.verified }}

jobs:
  Classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.check.outputs.verified || 'false' }}
    steps:
      - name: Identify candidate
        id: candidate
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'avio-release-bot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.base_ref == github.event.repository.default_branch &&
          startsWith(github.head_ref, 'chore/v')
        run: echo 'candidate=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.candidate.outputs.candidate == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete Semver plugin patch bump
        id: check
        if: steps.candidate.outputs.candidate == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FILES: ${{ inputs.version-files }}
        shell: python
        run: |
          import os, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args])
          def verified(base, head):
              files = set(os.environ['FILES'].strip().splitlines())
              changed = git('diff', '--name-only', '--no-renames', '-z', base, head).decode().split('\0')[:-1]
              if not files or files != set(changed):
                  return False
              for path in files:
                  if not re.fullmatch(r'(?:[\w.-]+/)*version\.properties', path):
                      return False
                  def content(ref):
                      if not git('ls-tree', ref, '--', path).startswith(b'100644 blob '):
                          raise ValueError('expected existing regular file')
                      text = git('show', ref + ':' + path).decode('ascii')
                      # Java Properties.store may change its generated timestamp.
                      return re.sub(r'^#(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun) [A-Z][a-z]{2} \d{2} \d\d:\d\d:\d\d [\w:+-]+ \d{4}$',
                                    '#timestamp', text, flags=re.M)
                  old = content(base)
                  fields = re.fullmatch(r'#Generated by the Semver Plugin for Gradle\n#timestamp\nversion\.buildmeta=\n'
                                        r'version\.major=(\d+)\nversion\.minor=(\d+)\nversion\.patch=(\d+)\n'
                                        r'version\.prerelease=\nversion\.semver=\1\.\2\.\3\n?', old)
                  if not fields:
                      return False
                  major, minor, patch = fields.groups()
                  target = f'{major}.{minor}.{int(patch)+1}-SNAPSHOT'
                  expected = old.replace('version.patch='+patch+'\n', f'version.patch={int(patch)+1}\n')
                  expected = expected.replace('version.prerelease=\n', 'version.prerelease=SNAPSHOT\n')
                  expected = expected.replace(f'version.semver={major}.{minor}.{patch}', 'version.semver='+target)
                  if expected != content(head) or os.environ['GITHUB_HEAD_REF'] != 'chore/v'+target:
                      return False
              return True
          try:
              ok = verified(os.environ['BASE'], os.environ['HEAD'])
          except ValueError:
              ok = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('verified=' + str(ok).lower(), file=out)

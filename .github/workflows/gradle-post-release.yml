name: Gradle Post Release Workflow

on:
  workflow_call:
    inputs:
      release-app-id:
        description: Optional GitHub App ID for creating snapshot PRs with automatic CI
        type: string
      app-version:
        description: Application version that was released
        required: true
        type: string
      java-distribution:
        description: The Java Distribution to use, default 'adopt-hotspot'
        required: false
        type: string
        default: adopt-hotspot
      java-version:
        description: The Java Version to use, default '8'
        required: false
        type: string
        default: 8
      main-branch:
        description: Main branch name
        required: false
        type: string
        default: main
      version-project:
        description: For use with multi-module projects, this is used to determine application version
        required: false
        type: string
      pr-reviewers:
        description: Users to be included on the post-release pull request
        required: false
        type: string
        default: adesjardin, manikmagar, kkingavio

    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: false

env:
  is-check-into-main: ${{ github.event_name != 'pull_request' && github.ref == format('refs/head/{0}',inputs.main-branch) }}
  is-snapshot: ${{ contains(inputs.app-version, 'SNAPSHOT') }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Prepare-Next-Snapshot:
    runs-on: ubuntu-latest
    # Cannot use env.* variables here - https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
    if: ${{ !contains(inputs.app-version, 'SNAPSHOT') && github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.main-branch) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Increment Version
        # Semver increment tasks access Project at execution time and cannot use
        # Gradle's configuration cache, even when enabled by the calling project.
        run: ./gradlew --no-configuration-cache incrementPatch -Dversion.prerelease=SNAPSHOT

      - name: Set New Version Variable
        id: set-new-version
        env:
          PROJECT: ${{ inputs.version-project }}
        run: |
          version=$(./gradlew "${PROJECT:+$PROJECT:}properties" -q | awk '/^version: / {print $2}')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]] || { echo 'Expected one next patch snapshot version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Mint repository-scoped release token
        if: inputs.release-app-id != ''
        id: release-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ inputs.release-app-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.release-token.outputs.token || github.token }}
          branch: "chore/v${{ steps.set-new-version.outputs.version }}"
          commit-message: "chore: [create-pull-request]  Auto increment to v${{ steps.set-new-version.outputs.version }}"
          title: "chore: Auto increment to v${{ steps.set-new-version.outputs.version }}"
          delete-branch: true
          assignees: ${{ github.actor }}
          reviewers: ${{ inputs.pr-reviewers }}

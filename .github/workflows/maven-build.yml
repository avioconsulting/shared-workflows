name: Maven Build Workflow

on:
  workflow_call:
    inputs:
      include-mule-ee-repo:
        description: Adds the Mule EE repo to settings.xml
        required: false
        type: boolean
        default: false
      java-distribution:
        description: The Java Distribution to use, default 'temurin'
        required: false
        type: string
        default: temurin
      java-version:
        description: The Java Version to use, default '8'
        required: false
        type: string
        default: 8
      include-test-results:
        description: A flag to run publish-unit-test-result
        required: false
        type: boolean
        default: true
      test-results-comments:
        description: Allow test result comments on pull requests
        required: false
        type: boolean
        default: true
      maven-settings-file:
        description: Optional settings.xml path in the caller repository; credentials must use environment variables
        required: false
        type: string
        default: ''
      diagnostics-path:
        description: Optional path or glob for caller-sanitized diagnostic files to upload, including on failure
        required: false
        type: string
        default: ''
      maven-args:
        description: Maven arguments appended to maven calls
        required: false
        type: string
      stage-maven-artifacts:
        description: Set to true if you need to stage Maven artifacts for JReleaser publishing during release
        required: false
        type: boolean
        default: false
    outputs:
      app-version:
        description: The application version
        value: ${{ jobs.Build-With-Maven.outputs.version }}
jobs:
  Build-With-Maven:
    runs-on: ubuntu-latest
    env:
      AVIO_REPO_USER: ${{ secrets.JFROG_USER }}
      AVIO_REPO_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
    outputs:
      version: ${{ steps.set-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          submodules: 'recursive'

      - name: Set up JDK for build and unit test
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          server-id: avio-releases
          server-username-env-var: AVIO_REPO_USER
          server-password-env-var: AVIO_REPO_PASSWORD

      - name: Restore Maven dependencies
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-shared-maven-${{ inputs.java-distribution }}-${{ inputs.java-version }}-v1-${{ hashFiles('**/pom.xml', '**/archetype.properties', inputs.maven-settings-file) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-shared-maven-${{ inputs.java-distribution }}-${{ inputs.java-version }}-v1-${{ hashFiles('**/pom.xml', '**/archetype.properties', inputs.maven-settings-file) }}-
            ${{ runner.os }}-shared-maven-${{ inputs.java-distribution }}-${{ inputs.java-version }}-v1-

      - name: Clear cached Maven resolution failures
        # Nested Maven invocations do not inherit the outer command's -U flag.
        run: |
          if [ -d "$HOME/.m2/repository" ]; then
            find "$HOME/.m2/repository" -type f -name '*.lastUpdated' -print -delete
          fi

      - name: Configure Maven repositories
        if: ${{ inputs.maven-settings-file != '' }}
        env:
          MAVEN_SETTINGS_FILE: ${{ inputs.maven-settings-file }}
        run: |
          mkdir -p "$HOME/.m2"
          install -m 600 "$MAVEN_SETTINGS_FILE" "$HOME/.m2/settings.xml"

      - name: Set Version
        id: set-version
        run: echo version=$(./mvnw -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec) >> $GITHUB_OUTPUT

      - name: Print Version
        run: echo "Version ${{ steps.set-version.outputs.version }}"

      - name: Compile
        id: compile
        run: ./mvnw compile ${{ inputs.maven-args }}

      - name: Verify
        run: ./mvnw --batch-mode verify ${{ inputs.maven-args }}

      - name: Stage Maven Artifacts
        if: ${{ inputs.stage-maven-artifacts }}
        run: ./mvnw -P release deploy -DskipTests=true ${{ inputs.maven-args }}

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.25.0
        if: ${{ !cancelled() && inputs.include-test-results && hashFiles('**/target/**/TEST-*.xml') != '' }}
        with:
          check_run: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          comment_mode: ${{ inputs.test-results-comments && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'always' || 'off' }}
          job_summary: true
          files: '**/target/**/TEST-*.xml'

      - name: Save Maven dependencies even after verification failure
        if: always() && steps.compile.outcome == 'success' && steps.maven-cache.outcome == 'success' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - name: Upload sanitized build diagnostics
        if: ${{ always() && inputs.diagnostics-path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: ${{ inputs.diagnostics-path }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Build Artifacts (JARs and Maven Staging Repo)
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            target/*.jar
            target/staging-deploy

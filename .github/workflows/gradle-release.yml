name: Gradle Release Workflow

on:
  workflow_call:
    inputs:
      app-version:
        description: Application version to release
        required: true
        type: string
      dry-run:
        description: Validate the full release without publishing artifacts or creating a GitHub release
        required: false
        type: boolean
        default: false
      java-distribution:
        description: The Java Distribution to use, default 'adopt-hotspot'
        required: false
        type: string
        default: adopt-hotspot
      java-version:
        description: The Java Version to use, default '8'
        required: false
        type: string
        default: 8
      gradle-args:
        description: Gradle arguments appended to gradle calls
        required: false
        type: string
      main-branch:
        description: Main branch name
        required: false
        type: string
        default: main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Release:
    # Cannot use env.* variables here - https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
    if: ${{ github.event_name != 'pull_request' && (inputs.dry-run || github.ref == format('refs/heads/{0}', inputs.main-branch)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: 'gradle'

      - name: Stage Deployment
        run: ./gradlew publish ${{ inputs.gradle-args }}

      - name: JReleaser full-Release
        uses: jreleaser/release-action@2.5.0
        env:
          JRELEASER_PROJECT_VERSION: ${{ inputs.app-version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          # Existing organization secret names are retained, but values must be
          # Central Portal user-token credentials, not retired OSSRH credentials.
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        with:
          version: '1.26.0'
          arguments: ${{ inputs.dry-run && 'full-release --dry-run' || 'full-release' }}

      - name: JReleaser release output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.dry-run && 'jreleaser-dry-run' || 'jreleaser-release' }}
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
      
